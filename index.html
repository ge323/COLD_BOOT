<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COLD_BOOT</title>

  <!-- 글꼴: Windows에서는 맑은 고딕·Segoe UI, Mac에서는 시스템 글꼴을 먼저 쓰고, 없으면 Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">

  <!-- 디자인 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 아이콘들이 함께 쓰는 그라디언트 (한 번만 정의) -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-folder-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8a93a"/><stop offset="1" stop-color="#c98a1f"/></linearGradient>
      <linearGradient id="g-folder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd768"/><stop offset="1" stop-color="#f4b73a"/></linearGradient>
      <linearGradient id="g-chat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0e9f74"/></linearGradient>
      <linearGradient id="g-mail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ea3ff"/><stop offset="1" stop-color="#0a6fd6"/></linearGradient>
      <linearGradient id="g-mail-flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fcbff"/><stop offset="1" stop-color="#4aa6f5"/></linearGradient>
      <linearGradient id="g-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9edf2"/></linearGradient>
      <linearGradient id="g-ev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f7f7"/><stop offset="1" stop-color="#d9dde3"/></linearGradient>
      <linearGradient id="g-bin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd8e3" stop-opacity=".75"/><stop offset=".5" stop-color="#f2f6fa" stop-opacity=".9"/><stop offset="1" stop-color="#b8c4d2" stop-opacity=".75"/></linearGradient>
      <linearGradient id="g-usb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7280"/><stop offset="1" stop-color="#374151"/></linearGradient>
      <linearGradient id="g-notes" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84d"/><stop offset="1" stop-color="#f5b800"/></linearGradient>
      <linearGradient id="g-photo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7ff"/><stop offset="1" stop-color="#b9e2ff"/></linearGradient>
    </defs>
  </svg>

  <div id="stage">

    <!-- 가상 PC (서진의 Windows 노트북) -->
    <main id="desktop">
      <div id="wall">
        <div class="sky"></div>
        <div class="moon"></div>
        <svg id="city" viewBox="0 0 1280 712" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="glow"></div>
        <canvas id="rain" width="1280" height="712" aria-hidden="true"></canvas>
        <div class="glass"></div>
      </div>
      <div id="icons" role="list"></div>
      <div id="windows"></div>
    </main>

    <!-- PC 초기화 화면 -->
    <div id="wipe" hidden></div>

    <!-- 시작 메뉴 -->
    <div id="startmenu" hidden></div>

    <!-- 작업 표시줄 (Windows) -->
    <footer id="taskbar">
      <div class="tb-center">
        <button id="btn-start" class="tb-btn" aria-label="시작">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" fill="#60cdff" opacity=".25"/>
            <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#60cdff" stroke-width="1.6"/>
            <rect x="8.5" y="8.5" width="7" height="7" rx="2" fill="#60cdff"/>
          </svg>
        </button>
        <button class="tb-btn tb-search" aria-hidden="true" tabindex="-1">
          <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div id="tb-apps"></div>
      </div>
      <div class="tray">
        <span class="tray-ic" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="tray-ime" title="한글 입력">가</span>
        <span class="tray-group" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.8 12.4a9.3 9.3 0 0 1 12.4 0M9.1 15.8a4.6 4.6 0 0 1 5.8 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="19.3" r="1.4" fill="currentColor"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg width="18" height="16" viewBox="0 0 28 24"><rect x="2" y="6" width="21" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4.5" y="8.5" width="11" height="7" rx="1" fill="currentColor"/><path d="M25 10v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <div id="clock" title="2026년 11월 20일 금요일">
          <span id="clock-time">오후 10:00</span>
          <span>2026-11-20</span>
        </div>
        <span class="tray-bell" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
      </div>
    </footer>

    <!-- 알림 (Windows) -->
    <div id="toasts" aria-live="polite"></div>

    <!-- 호스트 연결 막대: 도윤의 Mac에서 가상 PC를 보고 있다는 표시 + 게임 조작 -->
    <div id="hostbar">
      <span class="hb-dot" aria-hidden="true"></span>
      <span class="hb-title"><b>COLD_BOOT</b> · DEV-HANSJ-03 · 11/20 재생 <i id="loop-tag">LOOP 01</i></span>
      <div id="timeline" title="재생 위치">
        <div id="tl-fill"></div>
        <div id="tl-marks"></div>
        <i class="tl-wipe" title="23:58 PC 초기화"></i>
      </div>
      <div id="speed" role="group" aria-label="재생 속도">
        <button data-speed="0.5">½×</button>
        <button data-speed="1" class="on">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
      </div>
      <button id="btn-notes" class="notes-btn" aria-label="수사 노트 열기">수사 노트 <b id="notes-count">0</b></button>
      <button id="btn-sound" data-a="sound" aria-label="소리 켜고 끄기" aria-pressed="true">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="mute" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- 알림 (Mac, 호스트 쪽: 수사 노트 기록) -->
    <div id="htoasts" aria-live="polite"></div>

    <!-- 수사 노트를 여는 동안 재생을 멈췄다는 표시 -->
    <div id="veil" hidden>
      <span>
        <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
        재생 일시정지 · 수사 노트를 보는 중
      </span>
    </div>

    <!-- 수사 노트 (가상 PC 바깥, 도윤의 Mac) -->
    <aside id="notes" aria-label="수사 노트"></aside>

    <!-- 2단계 반전 -->
    <div id="twist" hidden></div>

    <!-- 회차가 끝날 때 -->
    <div id="lost" hidden></div>

    <!-- 잠금 화면 (회차마다 22:00) -->
    <div id="lock" hidden></div>

    <!-- 호스트 쪽 시작 화면: 첫 메일, 터미널 -->
    <div id="boot"></div>

    <!-- 엔딩 -->
    <div id="ending" hidden></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
